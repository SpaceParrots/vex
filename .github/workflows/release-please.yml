name: release-please

# Manually triggered: opens/updates a release PR that bumps the version and
# writes CHANGELOG.md. Merging that PR creates the git tag and GitHub Release.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
